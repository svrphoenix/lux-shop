name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /srv/luxshop
            test -d .git || { echo "Expected the LuxShop repository at /srv/luxshop" >&2; exit 1; }
            test -f .env.production || { echo "Missing /srv/luxshop/.env.production" >&2; exit 1; }
            git fetch origin main
            git pull --ff-only origin main
            docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
            docker compose --env-file .env.production -f docker-compose.production.yml up --build -d
            docker compose --env-file .env.production -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput
