services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-luxshop_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-luxshop_test_password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-luxshop_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_SECRET_KEY: ${TEST_SECRET_KEY:-test-secret-key}
      TEST_DATABASE_URL: postgresql://${TEST_POSTGRES_USER:-luxshop_test}:${TEST_POSTGRES_PASSWORD:-luxshop_test_password}@db-test:5432/${TEST_POSTGRES_DB:-luxshop_test}
    depends_on:
      db-test:
        condition: service_healthy
    command: ["uv", "run", "pytest"]
