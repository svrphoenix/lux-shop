services:
  db-test:
    image: postgres:17-alpine
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env.test
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.test}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}@db-test:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.test}
    depends_on:
      db-test:
        condition: service_healthy
    command: ["uv", "run", "pytest"]