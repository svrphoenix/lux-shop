[project]
name = "luxshop"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.18.1",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "psycopg[binary,pool]>=3.3.5",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C90",  # mccabe
    "UP",   # pyupgrade

    "RET",  # flake8-return
    "SIM",  # flake8-simplify

    "DJ",   # flake8-django
    "RSE",  # flake8-raise
]

ignore = [
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]
"**/settings/*.py" = ["F401", "E402", "F403", "F405"]
